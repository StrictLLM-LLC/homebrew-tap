name: Homebrew cask CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/update-cask.test.mjs

  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Tap checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/strictllm-llc"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/strictllm-llc/homebrew-tap"
      - name: Style
        run: brew style strictllm-llc/tap/strictllm
      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --online strictllm-llc/tap/strictllm
